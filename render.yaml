# Render Blueprint — разворачивает backend + базу PostgreSQL.
# Подключите репозиторий в Render → New → Blueprint, и сервис создастся автоматически.
databases:
  - name: payment-calendar-db
    plan: free

services:
  - type: web
    name: payment-calendar-api
    runtime: docker
    repo: https://github.com/ssabyrkulov/payment-calendar
    branch: claude/innowave-group-calendar-81tcby
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "720"
      - key: DATABASE_URL
        fromDatabase:
          name: payment-calendar-db
          property: connectionString
      - key: FIRST_ADMIN_EMAIL
        value: admin@innowave.group
      - key: FIRST_ADMIN_NAME
        value: Administrator
      # Задайте надёжный пароль в дашборде Render (отмечен sync:false — не хранится в репо).
      - key: FIRST_ADMIN_PASSWORD
        sync: false
      # После деплоя фронтенда на Vercel впишите сюда его адрес, напр. https://payment-calendar.vercel.app
      - key: CORS_ORIGINS
        value: "*"
