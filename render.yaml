# Render Blueprint — разворачивает весь портал (frontend + backend + база).
# Подключите репозиторий в Render → New → Blueprint, и сервис создастся автоматически.
databases:
  # ВАЖНО: план должен быть платным. Бесплатная база на Render живёт ~30 дней
  # и затем УДАЛЯЕТСЯ вместе со всеми данными портала (пользователи, права,
  # алиасы, пометки контрагентов, бюджет, привязки складов и точек SalesDoc).
  # Платный план — постоянное хранение и ежедневные резервные копии.
  - name: innowave-portal-db
    plan: basic-256mb

services:
  - type: web
    name: innowave-portal
    runtime: docker
    repo: https://github.com/ssabyrkulov/innowave-portal
    branch: claude/innowave-group-calendar-81tcby
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "720"
      - key: DATABASE_URL
        fromDatabase:
          name: innowave-portal-db
          property: connectionString
      - key: FIRST_ADMIN_EMAIL
        value: admin@innowave.group
      - key: FIRST_ADMIN_NAME
        value: Administrator
      # Задайте надёжный пароль в дашборде Render (sync:false — не хранится в репо).
      - key: FIRST_ADMIN_PASSWORD
        sync: false
      # Секрет автоприёма файлов из Google Drive (Apps Script)
      - key: INBOX_TOKEN
        generateValue: true
