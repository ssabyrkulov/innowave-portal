# Render Blueprint — разворачивает всё приложение (frontend + backend + база).
# Подключите репозиторий в Render → New → Blueprint, и сервис создастся автоматически.
databases:
  - name: payment-calendar-db
    plan: free

services:
  - type: web
    name: payment-calendar
    runtime: docker
    repo: https://github.com/ssabyrkulov/payment-calendar
    branch: claude/innowave-group-calendar-81tcby
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "720"
      - key: DATABASE_URL
        fromDatabase:
          name: payment-calendar-db
          property: connectionString
      - key: FIRST_ADMIN_EMAIL
        value: admin@innowave.group
      - key: FIRST_ADMIN_NAME
        value: Administrator
      # Задайте надёжный пароль в дашборде Render (sync:false — не хранится в репо).
      - key: FIRST_ADMIN_PASSWORD
        sync: false
