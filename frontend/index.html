<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <title>InnoWave Group — Корпоративный портал</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#202020" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="InnoWave" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Регистрируем сервис-воркер для установки на телефон (PWA).
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {})
        })
      }

      // Самолечение белого экрана. Если приложение не отрисовалось за
      // несколько секунд, значит страница осталась от прошлой версии и
      // тянет файл сборки, которого после выкладки уже нет. Сам по себе
      // такой экран не чинится: обновление отдаёт ту же страницу из кэша.
      // Поэтому один раз сбрасываем кэш и сервис-воркер и перезагружаемся;
      // повтор защищён отметкой в сессии, чтобы не уйти в бесконечный круг.
      setTimeout(function () {
        var root = document.getElementById('root')
        if (root && root.childElementCount > 0) return
        if (sessionStorage.getItem('iw_recovered')) return
        sessionStorage.setItem('iw_recovered', '1')
        var done = function () { location.reload() }
        var jobs = []
        if (window.caches && caches.keys) {
          jobs.push(caches.keys().then(function (ks) {
            return Promise.all(ks.map(function (k) { return caches.delete(k) }))
          }))
        }
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
          jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
            return Promise.all(rs.map(function (r) { return r.unregister() }))
          }))
        }
        Promise.all(jobs).then(done, done)
      }, 8000)
    </script>
  </body>
</html>
